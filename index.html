/*=============================
     WADAH4D LOADER V3
     FAST • SMOOTH • MOBILE
==============================*/

#loader{

    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#071426;

    z-index:999999;

    transition:
    opacity .35s ease,
    visibility .35s ease;

}

.loader-box{

    text-align:center;

    animation:fadeIn .5s ease;

}

.loader-logo{

    width:280px;
    max-width:75vw;

    user-select:none;
    pointer-events:none;

    animation:floatLogo 2.2s ease-in-out infinite;

}

/* BAR */

.loader-bar{

    width:230px;
    height:6px;

    margin:28px auto 16px;

    background:#172b46;

    border-radius:20px;

    overflow:hidden;

}

.loader-progress{

    display:block;

    width:100%;
    height:100%;

    background:linear-gradient(90deg,#55c7ff,#a8e8ff);

    transform:translateX(-100%);

    animation:progress .85s ease forwards;

}

.loader-text{
    display:flex;
    justify-content:center;
    gap:2px;
    margin-top:18px;
}

.loader-text span{

    font-size:18px;
    font-weight:800;
    letter-spacing:1px;

    background:linear-gradient(#e8f8ff,#55c7ff,#1677d2);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:
        0 1px 0 rgba(255,255,255,.4),
        0 2px 3px rgba(0,0,0,.35);

    animation:bounce .9s infinite ease-in-out;
}

.loader-text span:nth-child(2){animation-delay:.08s;}
.loader-text span:nth-child(3){animation-delay:.16s;}
.loader-text span:nth-child(4){animation-delay:.24s;}
.loader-text span:nth-child(5){animation-delay:.32s;}
.loader-text span:nth-child(6){animation-delay:.40s;}
.loader-text span:nth-child(7){animation-delay:.48s;}
.loader-text span:nth-child(8){animation-delay:.56s;}
.loader-text span:nth-child(9){animation-delay:.64s;}
.loader-text span:nth-child(10){animation-delay:.72s;}

@keyframes bounce{

    0%,100%{
        transform:translateY(0);
        opacity:.7;
    }

    50%{
        transform:translateY(-4px);
        opacity:1;
    }

}

.hide-loader{

    opacity:0;
    visibility:hidden;

}

/*=============================
          ANIMATION
==============================*/

@keyframes progress{

    to{

        transform:translateX(0);

    }

}

@keyframes fadeIn{

    from{

        opacity:0;
        transform:translateY(8px);

    }

    to{

        opacity:1;
        transform:translateY(0);

    }

}

@keyframes floatLogo{

    0%,100%{

        transform:translateY(0);

    }

    50%{

        transform:translateY(-5px);

    }

}

/* MOBILE */

@media(max-width:768px){

.loader-logo{

    width:220px;

}

.loader-bar{

    width:190px;

}

.loader-text{

    font-size:14px;

}

    }

 <script>
const loader = document.getElementById("loader");

function hideLoader() {

    if (!loader) return;

    loader.classList.add("hide-loader");

    setTimeout(() => {
        loader.remove();
    }, 5000);

}

document.addEventListener("DOMContentLoaded", () => {

    // Delay 800ms agar animasi terlihat smooth
    setTimeout(hideLoader, 5000);

});

// Backup jika halaman lambat
window.addEventListener("load", hideLoader);

// Paksa hilang maksimal 3 detik jika ada yang macet
setTimeout(hideLoader, 5000);
  </script>

:root{
  --bg:#08090b;
  --surface:#111316;
  --surface2:#17191d;
  --line:#272a2f;

  --gold2:#a8e8ff;
  --text:#f5f5f5;
  --muted:#858991;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  padding-bottom:78px;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
  background:radial-gradient(circle at 50% -10%,#1677d2 0,transparent 38%);
}
.top{
  position:sticky;top:0;z-index:30;
  background:
    linear-gradient(rgba(8,9,11,.92),rgba(8,9,11,.92)),
    url("https://wadahpordinih.com/images/logoweb.png");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
}
.topbar{
  height:64px;display:flex;align-items:center;justify-content:space-between;
  padding:8px 15px;max-width:600px;margin:auto;
}
.logo{display:block;height:43px;max-width:170px}
.logo img{height:100%;width:auto;display:block;object-fit:contain}
.icon-btn{
  width:38px;height:38px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);color:#ddd;font-size:17px;
}
.hero{
  max-width:600px;margin:auto;padding:27px 15px 20px;
}
.hero-box{
  border:1px solid #1e4d7a;border-radius:17px;padding:25px 20px;
  background:
    radial-gradient(circle at 85% 15%,rgba(66,186,255,.16),transparent 30%),
    linear-gradient(145deg,#102b4b,#101216 65%);
  overflow:hidden;position:relative;
}
.hero-box:after{
  content:"";position:absolute;width:130px;height:130px;border-radius:50%;
  right:-50px;bottom:-70px;border:1px solid #2d6da6;opacity:.5;
}
/* OUTLINE JALAN SETIAP SISI */
.hero-box{
  position:relative;
}

/* garis utama */
.hero-box::before{
  content:"";
  position:absolute;
  inset:0;
  border:2px solid #248fe0;
  border-radius:17px;
  pointer-events:none;
  z-index:99;
}

/* cahaya yang berjalan */
.hero-box::after{
  content:"";
  position:absolute;

  width:45px;
  height:2px;

  background:#55c7ff;

  box-shadow:0 0 5px #55c7ff;

  top:0;
  left:0;

  border-radius:10px;

  pointer-events:none;
  z-index:100;

  animation:kelilingBox 4s linear infinite;
}

@keyframes kelilingBox{

  /* ATAS */
  0%{
    top:0;
    left:0;
    width:45px;
    height:2px;
  }

  24%{
    top:0;
    left:calc(100% - 45px);
    width:45px;
    height:2px;
  }

  /* KANAN */
  25%{
    top:0;
    left:calc(100% - 2px);
    width:2px;
    height:45px;
  }

  49%{
    top:calc(100% - 45px);
    left:calc(100% - 2px);
    width:2px;
    height:45px;
  }

  /* BAWAH */
  50%{
    top:calc(100% - 2px);
    left:calc(100% - 45px);
    width:45px;
    height:2px;
  }

  74%{
    top:calc(100% - 2px);
    left:0;
    width:45px;
    height:2px;
  }

  /* KIRI */
  75%{
    top:calc(100% - 45px);
    left:0;
    width:2px;
    height:45px;
  }

  99%{
    top:0;
    left:0;
    width:2px;
    height:45px;
  }

  /* KEMBALI KE ATAS */
  100%{
    top:0;
    left:0;
    width:45px;
    height:2px;
  }
}

const gallery=document.getElementById("gallery");
const empty=document.getElementById("empty");
const total=document.getElementById("total");
const result=document.getElementById("result");
const searchInput=document.getElementById("searchInput");


function render(list){

  gallery.innerHTML="";

  total.textContent=list.length;
  result.textContent=list.length+" album";

  empty.style.display=list.length?"none":"block";


  list.forEach(x=>{

    const card=document.createElement("article");

    card.className="card";

    card.innerHTML=`
      <div class="photo">
        <span>BUKTI FOTO</span>
      </div>

      <div class="info">
        <div class="provider-name">${x.provider}</div>
        <div class="game">${x.game}</div>
        <div class="amount">${x.amount}</div>
        <div class="date">${x.date}</div>
      </div>
    `;


    const photo=card.querySelector(".photo");

    const img=new Image();

    img.src=x.img;
    img.alt=x.game;


    img.onload=()=>{

      photo.innerHTML="";

      /* GAMBAR */
      photo.appendChild(img);


      /* =========================
         TOMBOL VIEW
      ========================= */

      const view=document.createElement("div");

      view.style.cssText=
        "position:absolute;" +
        "right:43px;" +
        "bottom:7px;" +
        "background:rgba(0,0,0,.72);" +
        "color:#fff;" +
        "border:1px solid #555;" +
        "border-radius:5px;" +
        "padding:4px 6px;" +
        "font-size:7px;" +
        "cursor:pointer;" +
        "z-index:10;";

      view.textContent="VIEW";


      /* VIEW KLIK */
      view.onclick=(e)=>{
        e.stopPropagation();
        openImage(x.img);
      };


      photo.appendChild(view);


      /* =========================
         TOMBOL PLAY
      ========================= */

      const play=document.createElement("button");

      play.type="button";

      play.textContent="PLAY";

      play.style.cssText=
        "position:absolute;" +
        "right:7px;" +
        "bottom:7px;" +
        "background:rgba(0,0,0,.85);" +
        "color:#fff;" +
        "border:1px solid #55c7ff;" +
        "border-radius:5px;" +
        "padding:4px 8px;" +
        "font-size:7px;" +
        "font-weight:800;" +
        "cursor:pointer;" +
        "z-index:10;" +
        "transition:.2s ease;";


      /* PLAY KLIK */
      play.onclick=(e)=>{

        e.stopPropagation();

        if(x.playUrl){

          window.open(
            x.playUrl,
            "_blank",
            "noopener,noreferrer"
          );

        }

      };


      photo.appendChild(play);

    };


    /* KLIK GAMBAR */
    photo.onclick=()=>openImage(x.img);


    gallery.appendChild(card);

  });

}


function filterProvider(p){

  document
    .querySelectorAll(".provider")
    .forEach(b=>
      b.classList.toggle(
        "active",
        b.dataset.provider===p
      )
    );

  applyFilter(p,searchInput.value);

}


function applyFilter(p,query){

  const q=query.trim().toLowerCase();

  let list=
    p==="all"
      ?data
      :data.filter(x=>x.p===p);


  if(q){

    list=list.filter(x=>
      (
        x.provider+" "+
        x.game+" "+
        x.amount
      )
      .toLowerCase()
      .includes(q)
    );

  }


  render(list);

}


document
  .querySelectorAll(".provider")
  .forEach(b=>{

    b.addEventListener(
      "click",
      ()=>filterProvider(b.dataset.provider)
    );

  });


searchInput.addEventListener(
  "input",
  ()=>{

    const active=
      document
        .querySelector(".provider.active")
        .dataset.provider;

    applyFilter(
      active,
      searchInput.value
    );

  }
);


function openImage(src){

  document
    .getElementById("lightboxImg")
    .src=src;

  document
    .getElementById("lightbox")
    .classList.add("show");

}


document
  .getElementById("close")
  .onclick=()=>{

    document
      .getElementById("lightbox")
      .classList
      .remove("show");

  };


document
  .getElementById("lightbox")
  .onclick=e=>{

    if(e.target.id==="lightbox"){

      e.currentTarget
        .classList
        .remove("show");

    }

  };


render(data);
</script>
