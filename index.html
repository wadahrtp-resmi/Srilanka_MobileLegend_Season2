<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="utf-8"/>
<title>Daftar Tim — Tournament Mobile Legends SL</title>
<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --background: #4daede;
      --header: #4daede;
      --card: #4daede;
      --card-hover: #4daede;
      --border: #233c68;
      --blue: #ffd76a;
      --cyan: #ffd76a;
      --text: #ffffff;
      --muted: #fff2bf;
      --yellow: #ffd166;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(42, 117, 255, 0.12), transparent 32%),
        var(--background);
    }

    button,
    a {
      font-family: inherit;
    }

    /* HEADER */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      min-height: 88px;
      background: rgba(77,174,222, 0.97);
      border-bottom: 1px solid var(--border);
    }

    .header-container {
      width: min(1200px, calc(100% - 32px));
      min-height: 88px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      width: 50px;
      height: 50px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 15px;
      text-decoration: none;
      color: #4daede;
      font-size: 18px;
      font-weight: 900;
      background: linear-gradient(135deg, #59bde7, #ffd76a);
      box-shadow: 0 0 24px rgba(53, 185, 255, 0.22);
    }

    .brand {
      min-width: 0;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 900;
      line-height: 1.2;
    }

    .brand-subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .menu-button {
      width: 48px;
      height: 48px;
      margin-left: auto;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 15px;
      color: white;
      background: #4daede;
      cursor: pointer;
      font-size: 27px;
    }

    .menu-button:hover {
      background: #4daede;
    }

    .navigation {
      position: absolute;
      top: 76px;
      right: max(16px, calc((100% - 1200px) / 2));
      width: 230px;
      padding: 10px;
      display: none;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #4daede;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .navigation.show {
      display: block;
    }

    .navigation a {
      display: block;
      padding: 12px 14px;
      border-radius: 10px;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }

    .navigation a:hover,
    .navigation a.active {
      color: white;
      background: #4daede;
    }

    /* JUDUL */
    .hero {
      min-height: 285px;
      padding: 64px 20px 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .hero-badge {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid #ffffff;
      border-radius: 999px;
      color: var(--cyan);
      background: #4daede;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .hero h1 {
      margin-top: 20px;
      font-size: clamp(31px, 5vw, 48px);
      line-height: 1.1;
    }

    .hero p {
      margin-top: 14px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    /* ISI TIM */
    .content {
      width: min(1200px, calc(100% - 28px));
      margin: auto;
      padding: 42px 0 55px;
    }

    .filter-container {
      margin-bottom: 25px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
    }

    .filter-button {
      padding: 11px 17px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: #4daede;
      cursor: pointer;
      font-size: 13px;
      font-weight: 900;
    }

    .filter-button:hover,
    .filter-button.active {
      color: #4daede;
      border-color: var(--cyan);
      background: linear-gradient(135deg, var(--blue), var(--cyan));
    }

    .groups-container {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .group-card {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: linear-gradient(145deg, #4daede, #4daede);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.24);
    }

    .group-title {
      margin-bottom: 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .group-title h2 {
      color: var(--cyan);
      font-size: 22px;
    }

    .group-count {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .team-list {
      display: grid;
      gap: 11px;
    }

    .team-button {
      width: 100%;
      padding: 13px;
      display: flex;
      align-items: center;
      gap: 13px;
      border: 1px solid rgba(53, 185, 255, 0.18);
      border-radius: 14px;
      color: white;
      background: rgba(77,174,222,0.75);
      cursor: pointer;
      text-align: left;
      transition: 0.18s ease;
    }

    .team-button:hover {
      transform: translateY(-2px);
      border-color: var(--blue);
      background: var(--card-hover);
    }

    .team-logo {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: #4daede;
      background: linear-gradient(135deg, var(--yellow), #fff0a8);
      font-size: 14px;
      font-weight: 900;
    }

    .team-information {
      min-width: 0;
      flex: 1;
    }

    .team-name {
      font-size: 15px;
      font-weight: 900;
    }

    .team-description {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .team-arrow {
      color: var(--cyan);
      font-size: 20px;
      font-weight: 900;
    }

    /* POPUP PLAYER */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 999;
      padding: 20px;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(77,174,222,0.78);
      backdrop-filter: blur(5px);
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(520px, 100%);
      max-height: 88vh;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: #4daede;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.65);
    }

    .modal-header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 19px;
      display: flex;
      align-items: center;
      gap: 13px;
      border-bottom: 1px solid var(--border);
      background: #4daede;
    }

    .modal-team-logo {
      width: 51px;
      height: 51px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: #4daede;
      background: linear-gradient(135deg, var(--yellow), #fff0a8);
      font-weight: 900;
    }

    .modal-title {
      flex: 1;
    }

    .modal-title h2 {
      font-size: 20px;
    }

    .modal-title p {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .close-button {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: white;
      background: #4daede;
      cursor: pointer;
      font-size: 21px;
    }

    .player-container {
      padding: 18px;
      display: grid;
      gap: 10px;
    }

    .player-row {
      padding: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(53, 185, 255, 0.18);
      border-radius: 13px;
      background: #4daede;
    }

    .player-number {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: #4daede;
      background: var(--cyan);
      font-weight: 900;
    }

    .player-name {
      font-weight: 900;
    }

    .player-role {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    /* FOOTER */
    .footer {
      padding: 26px 15px;
      border-top: 1px solid var(--border);
      text-align: center;
      background: #4daede;
    }

    .footer span {
      display: inline-block;
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--cyan);
      font-size: 12px;
      font-weight: 900;
    }

    @media (max-width: 760px) {
      .header-container {
        width: calc(100% - 20px);
      }

      .brand-title {
        font-size: 12px;
      }

      .brand-subtitle {
        font-size: 11px;
      }

      .hero {
        min-height: 260px;
        padding-top: 45px;
      }

      .groups-container {
        grid-template-columns: 1fr;
      }

      .group-card {
        padding: 16px;
      }
    }
  </style>

<script>
(function () {
    function rapikanFooterUniversal() {
        const footer =
            document.querySelector("footer.sl-universal-footer") ||
            document.querySelector("footer");

        if (!footer) return;

        footer.classList.add("sl-universal-footer");

        /*
         * Cari elemen terkecil yang berisi teks footer.
         * Jangan memilih induk besar bila ada anak yang lebih tepat.
         */
        const candidates = Array.from(
            footer.querySelectorAll("div, p, span, strong")
        ).filter(function (element) {
            const text =
                (element.textContent || "")
                    .replace(/\s+/g, " ")
                    .trim()
                    .toUpperCase();

            return (
                text.includes("TOURNAMENT MOBILE LEGENDS") &&
                text.includes("SEASON 2")
            );
        });

        let textElement = null;

        candidates.forEach(function (element) {
            const hasMatchingChild =
                Array.from(element.children).some(function (child) {
                    const childText =
                        (child.textContent || "")
                            .replace(/\s+/g, " ")
                            .trim()
                            .toUpperCase();

                    return (
                        childText.includes("TOURNAMENT MOBILE LEGENDS") &&
                        childText.includes("SEASON 2")
                    );
                });

            if (!hasMatchingChild && !textElement) {
                textElement = element;
            }
        });

        if (!textElement) {
            textElement =
                candidates[candidates.length - 1] ||
                footer.firstElementChild ||
                footer;
        }

        textElement.classList.add(
            "sl-footer-text-universal"
        );

        textElement.style.setProperty(
            "color",
            "#ffffff",
            "important"
        );

        textElement.style.setProperty(
            "opacity",
            "1",
            "important"
        );

        textElement.querySelectorAll("*")
            .forEach(function (child) {
                child.style.setProperty(
                    "color",
                    "#ffffff",
                    "important"
                );

                child.style.setProperty(
                    "opacity",
                    "1",
                    "important"
                );
            });
    }

    if (document.readyState === "loading") {
        document.addEventListener(
            "DOMContentLoaded",
            rapikanFooterUniversal
        );
    } else {
        rapikanFooterUniversal();
    }
})();
</script>

<script>
(function () {
    function pasangSeamlessMobile() {
        const premium =
            document.getElementById("slPremiumFinal");

        if (premium) {
            /*
             * Tambahkan penyambung gradasi bawah.
             */
            let bottomBlend =
                premium.querySelector(".sl-bottom-blend");

            if (!bottomBlend) {
                bottomBlend =
                    document.createElement("div");

                bottomBlend.className =
                    "sl-bottom-blend";

                premium.appendChild(bottomBlend);
            }

            /*
             * Hapus elemen SVG animate pada ponsel.
             * Ini membuat scrolling jauh lebih ringan.
             */
            const isMobile =
                window.matchMedia(
                    "(max-width: 768px)"
                ).matches;

            if (isMobile) {
                premium.querySelectorAll(
                    "animate, animateTransform, animateMotion"
                ).forEach(function (animation) {
                    animation.remove();
                });
            }
        }

        /*
         * Cegah elemen halaman melebar keluar layar.
         * Hanya perbaiki elemen yang benar-benar overflow.
         */
        if (
            window.matchMedia(
                "(max-width: 768px)"
            ).matches
        ) {
            document.querySelectorAll("body *")
                .forEach(function (element) {
                    if (
                        element.id === "slPremiumFinal" ||
                        element.closest("#slPremiumFinal")
                    ) {
                        return;
                    }

                    const rect =
                        element.getBoundingClientRect();

                    if (
                        rect.width >
                        document.documentElement.clientWidth + 3
                    ) {
                        element.style.setProperty(
                            "max-width",
                            "100%",
                            "important"
                        );

                        element.style.setProperty(
                            "box-sizing",
                            "border-box",
                            "important"
                        );
                    }
                });
        }

        /*
         * Pastikan posisi horizontal selalu kembali ke kiri.
         */
        if (window.scrollX !== 0) {
            window.scrollTo({
                left: 0,
                top: window.scrollY,
                behavior: "instant"
            });
        }
    }

    if (document.readyState === "loading") {
        document.addEventListener(
            "DOMContentLoaded",
            pasangSeamlessMobile
        );
    } else {
        pasangSeamlessMobile();
    }

    window.addEventListener(
        "load",
        pasangSeamlessMobile
    );

    window.addEventListener(
        "resize",
        pasangSeamlessMobile
    );
})();
</script>
